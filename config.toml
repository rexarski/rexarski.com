baseURL = "https://rexarski.com"

title = "rexarski"
author = "Qiū Ruì"
copyright = "© Qiū Ruì"
locale = "zh-CN"

# static/robots.txt is served as-is; no generated one.
enableRobotsTXT = false

disableKinds = ["taxonomy"]
ignoreErrors = ["error-disable-taxonomy"]

[permalinks]
  posts = "/posts/:year/:month/:slug/"
  tags = "/:slug/"

[markup.goldmark.renderer]
  unsafe= true

# A light Chroma style; the block's background comes from --code-bg in main.css.
[markup.highlight]
  style = "github"

# Keep ASCII quotes, dashes and dots as typed: Noto Sans SC renders the
# curly ’ full-width, which leaves an ugly gap in English text.
[markup.goldmark.extensions.typographer]
  disable = true

# Lets a list take a class via a trailing `{.app-grid}` line (toolbox app lists).
[markup.goldmark.parser.attribute]
  block = true

[params]
  # Fallback <meta name="description"> for pages without one.
  description = "blog"
  # Default og:image / twitter:image for pages without images of their own.
  images = ["images/share.jpg"]

[markup.tableOfContents]
  startLevel = 2
  endLevel = 3
  ordered = false

# RSS is full-text (see layouts/index.rss.xml), so cap the feed at the latest
# 20 posts to keep it lean instead of shipping the whole archive every poll.
[services.rss]
  limit = 20
